pluginManagement {
    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

rootProject.name = "multi-version-loader-example-mod"

apply from: file("gradle/targets.gradle")

include("tests:unit")
targets.keySet().each { minecraft ->
    ["fabric", "neoforge"].each { loader ->
        def targetPath = ":versions:${loader}-${minecraft}"
        include(targetPath)
        // Gradle 9 requires these directories, even without per-target scripts.
        project(targetPath).projectDir.mkdirs()
    }
}
