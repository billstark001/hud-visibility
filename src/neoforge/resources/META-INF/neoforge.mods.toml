modLoader="javafml"
loaderVersion="[4,)"
license="MIT"

[[mixins]]
config="${modId}.mixins.json"

[[mods]]
modId="${modId}"
version="${version}"
displayName="${modName}"
authors="${modAuthor}"
${neoForgeIconProperty}="assets/${modId}/icon.png"
description='''${modDescription}'''

[[dependencies.${modId}]]
modId="neoforge"
type="required"
versionRange="${neoForgeRange}"
ordering="NONE"
side="BOTH"

[[dependencies.${modId}]]
modId="minecraft"
type="required"
versionRange="${minecraftNeoRange}"
ordering="NONE"
side="BOTH"
